<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Cyan to Indigo Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- White Glow Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="4" />

  <!-- Cage / Bracket Graphic Center (Scale origin: 256, 256) -->
  <g transform="translate(256, 256)">

    <!-- Ambient Glow behind symbol -->
    <circle cx="0" cy="0" r="110" fill="#00F0FF" opacity="0.08" filter="blur(30px)" />

    <!-- Left Cage Bar (Breaking open into left curly bracket { ) -->
    <!-- Top left bar -->
    <line x1="-100" y1="-140" x2="-100" y2="-90" stroke="#475569" stroke-width="12" stroke-linecap="round" />
    <!-- Bottom left bar -->
    <line x1="-100" y1="90" x2="-100" y2="140" stroke="#475569" stroke-width="12" stroke-linecap="round" />
    
    <!-- Left Bracket { Shape -->
    <path d="M -60 -120 
             C -90 -120, -90 -70, -90 -30 
             C -90 0, -125 0, -125 0 
             C -125 0, -90 0, -90 30 
             C -90 70, -90 120, -60 120" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#cyanGlow)" />

    <!-- Right Cage Bar (Breaking open into right curly bracket } ) -->
    <!-- Top right bar -->
    <line x1="100" y1="-140" x2="100" y2="-90" stroke="#475569" stroke-width="12" stroke-linecap="round" />
    <!-- Bottom right bar -->
    <line x1="100" y1="90" x2="100" y2="140" stroke="#475569" stroke-width="12" stroke-linecap="round" />

    <!-- Right Bracket } Shape -->
    <path d="M 60 -120 
             C 90 -120, 90 -70, 90 -30 
             C 90 0, 125 0, 125 0 
             C 125 0, 90 0, 90 30 
             C 90 70, 90 120, 60 120" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#cyanGlow)" />

    <!-- Central Freedom Arrow / Code Ray Burst (Ascending outward) -->
    <!-- Dynamic slash / unlock ray -->
    <line x1="-35" y1="65" x2="35" y2="-65" 
          stroke="url(#whiteGrad)" 
          stroke-width="14" 
          stroke-linecap="round" />

    <!-- Upper-Right Arrow Accent (Escaping the cage) -->
    <path d="M 0 -65 L 35 -65 L 35 -30" 
          fill="none" 
          stroke="#00F0FF" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Subtle accent dots for digital precision -->
    <circle cx="0" cy="0" r="6" fill="#00F0FF" />
  </g>
</svg>
